name: Nightly flaky-test detector

# T-210 — run the full test suite with each file repeated 5 times to surface
# non-deterministic (flaky) tests. Runs once per day at 05:00 UTC (off-peak)
# and can be triggered manually for on-demand flaky investigation.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-nightly
  cancel-in-progress: true

jobs:
  flaky-detector:
    name: Flaky test detector (--rerun-each=5)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install deps
        working-directory: agent
        run: bun install --frozen-lockfile

      - name: Run suite with reruns (detect flakes)
        working-directory: agent
        # --rerun-each=5 runs every test file 5 times back-to-back.
        # Any file that passes on some runs and fails on others is flaky.
        # Output is captured so we can upload it as an artifact if the job fails.
        run: bun test --rerun-each=5 2>&1 | tee /tmp/bun-flaky-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flaky-test-output-${{ github.run_id }}
          path: /tmp/bun-flaky-output.txt
          retention-days: 14
