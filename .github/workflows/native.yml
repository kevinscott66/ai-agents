name: Native Checks

# AUD-20260919-007 — зелёный PR не проверял native-часть: ни Swift-регрессии
# iPhone-клиента (ios/tests/run.py), ни сборку приложения, ни Go-ядро
# OpenFluxCore. Сломанный runner (AUD-006) месяцами был не виден CI.
#
# Все три джобы работают без сертификатов владельца: сборка — без подписи,
# как ios/build-unsigned.sh. Недоверенных входов (заголовков, веток PR) здесь
# нет.
#
# AUD-20260919-004 — эти проверки сделаны обязательными в защите main, поэтому
# фильтра путей в триггере больше нет: пропущенный из-за `paths:` workflow не
# присылает check run вовсе, и PR без native-изменений ждал бы его вечно.
# Экономию macOS-минут даёт джоба detect: она считает, задеты ли native-пути, а
# три тяжёлые джобы висят на её выходе через `if:`. Пропущенная по `if:` джоба
# отдаёт заключение skipped, и защита ветки считает такую проверку выполненной.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Native paths touched?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.check.outputs.native }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Сравнить с базой PR
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # workflow_dispatch: базы нет, гоняем всё.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # Тот же список, что раньше стоял в paths: триггера.
          if printf '%s\n' "$changed" | grep -qE '^(ios/|agent/miniapp/|agent/lib/signed-actions\.ts$|\.github/workflows/native\.yml$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'затронутых файлов: %s\n' "$(printf '%s\n' "$changed" | grep -c . || true)"

  openflux-core:
    name: OpenFluxCore (go test)
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ios/OpenFluxCore/go.mod
          cache-dependency-path: ios/OpenFluxCore/go.sum

      - name: go vet + go test
        working-directory: ios/OpenFluxCore
        run: |
          go vet ./...
          go test -mod=readonly ./...

  ios-regressions:
    name: iOS regressions (ios/tests/run.py)
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Шаг с подписью сверяет подпись iPhone с сервером через bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install deps
        working-directory: agent
        run: bun install --frozen-lockfile

      - name: Toolchain
        run: xcodebuild -version && xcrun swiftc --version

      - name: Run regressions
        run: python3 ios/tests/run.py

  ios-build:
    name: iOS build (unsigned)
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ios/OpenFluxCore/go.mod
          cache-dependency-path: ios/OpenFluxCore/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install miniapp deps
        working-directory: agent/miniapp
        run: bun install --frozen-lockfile

      - name: Build without signing
        env:
          AGENT_IOS_BUILD_DIR: ${{ runner.temp }}/agent-ios
        run: sh ios/build-unsigned.sh
