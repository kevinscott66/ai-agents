services:
  agent-team:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-team:local
    container_name: agent-team
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIAPP_PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: standalone local dev server for the Mini App.
  # In production, the Mini App is served by the agent-team process itself,
  # so this service is gated behind the `miniapp-dev` profile.
  # Start with:  docker compose --profile miniapp-dev up miniapp-dev
  miniapp-dev:
    profiles: ["miniapp-dev"]
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    image: agent-miniapp:local
    container_name: agent-miniapp-dev
    restart: unless-stopped
    ports:
      - "8080:80"
