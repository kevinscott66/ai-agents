<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Geometric decoration -->
  <circle cx="1050" cy="100" r="80" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="300" r="60" fill="#ffffff" opacity="0.08"/>
  <polygon points="100,50 150,50 125,100" fill="#ffffff" opacity="0.1"/>
  
  <!-- Main content card -->
  <rect x="150" y="80" width="900" height="240" rx="16" fill="url(#cardGrad)"/>
  
  <!-- Title area -->
  <text x="200" y="130" fill="#1e40af" font-family="Arial, sans-serif" font-size="42" font-weight="bold">{{TITLE}}</text>
  <text x="200" y="170" fill="#475569" font-family="Arial, sans-serif" font-size="20">{{SUBTITLE}}</text>
  
  <!-- Action button area -->
  <rect x="200" y="220" width="180" height="50" rx="25" fill="#3b82f6"/>
  <text x="290" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">{{CTA_BUTTON}}</text>
  
  <!-- Right side content -->
  <text x="500" y="220" fill="#64748b" font-family="Arial, sans-serif" font-size="16">{{DESCRIPTION_LINE_1}}</text>
  <text x="500" y="245" fill="#64748b" font-family="Arial, sans-serif" font-size="16">{{DESCRIPTION_LINE_2}}</text>
  <text x="500" y="270" fill="#64748b" font-family="Arial, sans-serif" font-size="16">{{DESCRIPTION_LINE_3}}</text>
  
  <!-- Icon/Logo area -->
  <circle cx="900" cy="200" r="40" fill="#3b82f6" opacity="0.2"/>
  <circle cx="900" cy="200" r="25" fill="#3b82f6"/>
  <text x="900" y="210" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">{{ICON_TEXT}}</text>
</svg>