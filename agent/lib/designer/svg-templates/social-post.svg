<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Main content card -->
  <rect x="140" y="200" width="800" height="680" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Header area -->
  <rect x="180" y="240" width="720" height="120" rx="12" fill="#f8fafc"/>
  <text x="540" y="285" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="36" font-weight="bold">{{TITLE}}</text>
  <text x="540" y="315" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">{{SUBTITLE}}</text>
  <text x="540" y="340" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">{{DATE}}</text>
  
  <!-- Main content -->
  <text x="200" y="420" fill="#1e293b" font-family="Arial, sans-serif" font-size="20" font-weight="600">{{CONTENT_HEADER}}</text>
  <text x="200" y="460" fill="#475569" font-family="Arial, sans-serif" font-size="16">{{CONTENT_LINE_1}}</text>
  <text x="200" y="485" fill="#475569" font-family="Arial, sans-serif" font-size="16">{{CONTENT_LINE_2}}</text>
  <text x="200" y="510" fill="#475569" font-family="Arial, sans-serif" font-size="16">{{CONTENT_LINE_3}}</text>
  
  <!-- Feature highlight -->
  <rect x="200" y="540" width="680" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="230" cy="580" r="12" fill="#3b82f6"/>
  <text x="255" y="575" fill="#1e40af" font-family="Arial, sans-serif" font-size="16" font-weight="bold">{{HIGHLIGHT_TITLE}}</text>
  <text x="255" y="595" fill="#1e40af" font-family="Arial, sans-serif" font-size="14">{{HIGHLIGHT_CONTENT}}</text>
  
  <!-- Call to action -->
  <rect x="200" y="660" width="200" height="50" rx="25" fill="#3b82f6"/>
  <text x="300" y="690" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">{{CTA_TEXT}}</text>
  
  <!-- Tags/hashtags -->
  <text x="200" y="750" fill="#6b7280" font-family="Arial, sans-serif" font-size="14">{{HASHTAG_1}} {{HASHTAG_2}} {{HASHTAG_3}}</text>
  
  <!-- Logo/brand area -->
  <circle cx="800" cy="700" r="30" fill="#f59e0b"/>
  <text x="800" y="710" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">{{BRAND_INITIAL}}</text>
  <text x="800" y="750" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">{{BRAND_NAME}}</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="20" fill="#fbbf24" opacity="0.3"/>
  <circle cx="880" cy="180" r="15" fill="#10b981" opacity="0.3"/>
  <circle cx="150" cy="950" r="25" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="930" cy="920" r="18" fill="#ef4444" opacity="0.3"/>
</svg>