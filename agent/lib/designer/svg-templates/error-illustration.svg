<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee2e2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Error icon -->
  <circle cx="300" cy="120" r="40" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="300" cy="120" r="25" fill="#ef4444"/>
  <text x="300" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">!</text>
  
  <!-- Error message -->
  <text x="300" y="200" text-anchor="middle" fill="#991b1b" font-family="Arial, sans-serif" font-size="28" font-weight="bold">{{ERROR_TITLE}}</text>
  <text x="300" y="230" text-anchor="middle" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="16">{{ERROR_SUBTITLE}}</text>
  
  <!-- Error details -->
  <rect x="100" y="260" width="400" height="80" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="120" y="285" fill="#991b1b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">{{ERROR_CODE}}</text>
  <text x="120" y="305" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="12">{{ERROR_DESCRIPTION}}</text>
  <text x="120" y="325" fill="#a21caf" font-family="Arial, sans-serif" font-size="12">{{ERROR_SUGGESTION}}</text>
  
  <!-- Action button -->
  <rect x="250" y="360" width="100" height="30" rx="15" fill="#dc2626"/>
  <text x="300" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">{{ACTION_BUTTON}}</text>
</svg>